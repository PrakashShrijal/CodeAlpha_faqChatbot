<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase – FAQ Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- ===================================================================
       App Shell
  ==================================================================== -->
  <div class="app-container">

    <!-- ── Sidebar ──────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🛒</span>
          <span class="logo-text">ShopEase</span>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">✕</button>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-label">BROWSE BY TOPIC</p>
        <button class="nav-btn active" data-category="all">
          <span class="nav-icon">💬</span> All Topics
        </button>
        <button class="nav-btn" data-category="Orders">
          <span class="nav-icon">📦</span> Orders
        </button>
        <button class="nav-btn" data-category="Returns &amp; Refunds">
          <span class="nav-icon">↩️</span> Returns &amp; Refunds
        </button>
        <button class="nav-btn" data-category="Payments">
          <span class="nav-icon">💳</span> Payments
        </button>
        <button class="nav-btn" data-category="Account">
          <span class="nav-icon">👤</span> Account
        </button>
        <button class="nav-btn" data-category="Products">
          <span class="nav-icon">🏷️</span> Products
        </button>
        <button class="nav-btn" data-category="Shipping">
          <span class="nav-icon">🚚</span> Shipping
        </button>
        <button class="nav-btn" data-category="Support">
          <span class="nav-icon">🎧</span> Support
        </button>
        <button class="nav-btn" data-category="Offers">
          <span class="nav-icon">🎁</span> Offers
        </button>
        <button class="nav-btn" data-category="Wishlist">
          <span class="nav-icon">❤️</span> Wishlist
        </button>
      </nav>

      <div class="sidebar-footer">
        <p class="sidebar-info">Powered by TF-IDF &amp; cosine similarity</p>
        <div id="faqCount" class="faq-count-badge">Loading FAQs…</div>
      </div>
    </aside>

    <!-- ── Main Chat Panel ──────────────────────────────────────────── -->
    <main class="chat-panel">

      <!-- Header -->
      <header class="chat-header">
        <button class="menu-btn" id="menuBtn" aria-label="Open sidebar">☰</button>
        <div class="header-info">
          <div class="bot-avatar" aria-hidden="true">🤖</div>
          <div class="header-text">
            <h1 class="header-title">FAQ Chatbot</h1>
            <span class="header-subtitle" id="statusDot">
              <span class="dot dot-green"></span> Online
            </span>
          </div>
        </div>
        <button class="clear-btn" id="clearBtn" title="Clear conversation">
          🗑️ Clear
        </button>
      </header>

      <!-- Message list -->
      <div class="messages-container" id="messagesContainer" role="log" aria-live="polite">
        <!-- Welcome message injected by JS -->
      </div>

      <!-- Suggested questions -->
      <div class="suggestions-bar" id="suggestionsBar">
        <div class="suggestions-label">Try asking:</div>
        <div class="suggestions-scroll" id="suggestionsScroll">
          <button class="suggestion-chip" data-q="How can I track my order?">📦 Track order</button>
          <button class="suggestion-chip" data-q="What is the return policy?">↩️ Return policy</button>
          <button class="suggestion-chip" data-q="What payment methods are accepted?">💳 Payment options</button>
          <button class="suggestion-chip" data-q="How long does delivery take?">🚚 Delivery time</button>
          <button class="suggestion-chip" data-q="How do I contact customer support?">🎧 Contact support</button>
          <button class="suggestion-chip" data-q="Do you offer free shipping?">🆓 Free shipping</button>
          <button class="suggestion-chip" data-q="I forgot my password. How do I reset it?">🔐 Reset password</button>
          <button class="suggestion-chip" data-q="Can I cancel my order after placing it?">❌ Cancel order</button>
        </div>
      </div>

      <!-- Input bar -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="questionInput"
            class="question-input"
            placeholder="Ask me anything about ShopEase…"
            rows="1"
            maxlength="500"
            aria-label="Type your question here"
          ></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                 stroke-linejoin="round" width="18" height="18">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="char-count" id="charCount">0 / 500</p>
      </div>

    </main>

  </div>

  <!-- FAQ Browse Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Browse FAQs</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
